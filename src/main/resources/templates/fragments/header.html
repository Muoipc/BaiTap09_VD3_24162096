<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="header">
    <a th:href="@{/}" class="brand">IOTSTAR SHOP</a>
    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/products}">Products</a>
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/users}">Users</a>
    </nav>
    <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
        <span th:text="${#authentication.name}" style="margin-right: 10px;"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="link-button">Logout</button>
        </form>
    </div>
    <div class="account" th:unless="${#authorization.expression('isAuthenticated()')}">
        <a th:href="@{/login}" style="color: #fff; text-decoration: none; margin-right: 12px;">Login</a>
        <a th:href="@{/register}" style="color: #dbeafe; text-decoration: none;">Register</a>
    </div>
</header>

</body>
</html>
