<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header" class="custom-header">
    <nav class="header-nav">
        <div class="header-brand">
            <a th:href="@{/}">IOTSTAR SHOP</a>
        </div>

        <div class="header-links">
            <a th:href="@{/}">Trang chủ</a>
            <a th:href="@{/products}">Sản phẩm</a>
            <a th:href="@{/users}" sec:authorize="hasRole('ADMIN')">Quản lý User</a>
        </div>

        <div class="header-auth" th:if="${#authorization.expression('isAuthenticated()')}">
            <div class="user-profile">
                <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : 'https://placehold.co/150x150?text=User'}"
                     alt="Avatar"
                     class="user-avatar">

                <span class="user-name" th:text="${#authentication.principal.fullName}">Họ tên</span>
                <span class="role-badge" th:text="${#authentication.principal.role}">ROLE_USER</span>
            </div>

            <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-logout">Đăng xuất</button>
            </form>
        </div>

        <div class="header-guest" th:unless="${#authorization.expression('isAuthenticated()')}">
            <a class="btn-login" th:href="@{/login}">Đăng nhập</a>
            <a class="btn-register" th:href="@{/register}">Đăng ký</a>
        </div>
    </nav>
</header>

</body>
</html>
