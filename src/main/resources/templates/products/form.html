<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"></head>
<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}"></h1>

    <div class="panel">
        <form th:object="${productDTO}"
              th:with="actionUrl=${mode == 'create' ? '/products/create' : '/products/edit/' + productDTO.id}"
              th:action="${actionUrl}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">

            <div style="margin-bottom: 14px;">
                <label for="name" style="display:block; font-weight:600; margin-bottom:4px;">Tên sản phẩm</label>
                <input id="name" type="text" th:field="*{name}" style="width:100%;">
                <small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </div>

            <div style="margin-bottom: 14px;">
                <label for="price" style="display:block; font-weight:600; margin-bottom:4px;">Giá</label>
                <input id="price" type="number" step="0.01" th:field="*{price}" style="width:100%;">
                <small class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
            </div>

            <div style="margin-bottom: 14px;">
                <label for="userId" style="display:block; font-weight:600; margin-bottom:4px;">User sở hữu</label>
                <select id="userId" th:field="*{userId}" style="width:100%;">
                    <option th:each="u : ${usersList}" th:value="${u.id}" th:text="${u.fullName} + ' (' + ${u.username} + ')'"></option>
                </select>
            </div>

            <div style="margin-bottom: 14px;">
                <label for="image" style="display:block; font-weight:600; margin-bottom:4px;">Ảnh</label>
                <input id="image" type="file" name="image" accept="image/*" style="width:100%;">
            </div>

            <div style="margin-bottom: 14px;" th:if="${productDTO.imageUrl != null}">
                <img th:src="${productDTO.imageUrl}" class="thumb" alt="Preview">
            </div>

            <div style="margin-bottom: 14px;">
                <label for="description" style="display:block; font-weight:600; margin-bottom:4px;">Mô tả</label>
                <textarea id="description" th:field="*{description}" rows="5" style="width:100%;"></textarea>
            </div>

            <div>
                <button type="submit" class="button">Lưu</button>
                <a class="button secondary" th:href="@{/products}">Hủy</a>
            </div>
        </form>
    </div>
</main>
</div>

</body>
</html>
