<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Sản phẩm - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container">
    <div class="page-title">
        <div>
            <h1>Quản lý Danh sách Sản phẩm</h1>
            <p class="subtitle">Quan hệ 1 User - N Product, upload hình ảnh, tìm kiếm & phân trang</p>
        </div>
        <div>
            <a class="btn primary" th:href="@{/products/create}">+ Thêm Sản phẩm mới</a>
        </div>
    </div>

    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="panel" style="margin-bottom: 20px;">
        <form th:action="@{/products}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên sản phẩm..." class="search-input">
            <button type="submit" class="btn primary">Tìm kiếm</button>
            <a th:href="@{/products}" class="btn secondary">Làm mới</a>
        </form>
    </div>

    <div class="panel">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Hình ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Người đăng (User)</th>
                    <th>Mô tả</th>
                    <th style="text-align: right;">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products.content}">
                    <td th:text="'#' + ${p.id}">#1</td>
                    <td>
                        <img th:src="${p.imageUrl}" alt="Product"
                             style="width: 50px; height: 50px; object-fit: contain; border-radius: 6px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 2px;">
                    </td>
                    <td class="fw-bold" th:text="${p.name}">iPhone 16</td>
                    <td style="color: #dc2626; font-weight: bold;"
                        th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">30,000,000 đ</td>
                    <td>
                        <span class="user-badge" th:text="${p.userFullName != null ? p.userFullName : p.username}">Admin</span>
                    </td>
                    <td style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" th:text="${p.description}">Mô tả chi tiết</td>
                    <td style="text-align: right;">
                        <a class="btn-action edit" th:href="@{/products/edit/{id}(id=${p.id})}">Sửa</a>
                        <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc muốn xóa sản phẩm này?');">
                            <button type="submit" class="btn-action delete">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${products.empty}">
                    <td colspan="7" style="text-align: center; color: #94a3b8; padding: 30px;">Chưa có sản phẩm nào được tạo.</td>
                </tr>
            </tbody>
        </table>

        <div class="pagination-wrapper" th:if="${totalPages > 1}">
            <span th:text="'Hiển thị trang ' + (${currentPage + 1}) + ' / ' + ${totalPages} + ' (Tổng ' + ${totalElements} + ' sản phẩm)'"></span>
            <div class="pagination">
                <a th:if="${products.hasPrevious()}" th:href="@{/products(page=${currentPage - 1}, keyword=${keyword}, size=${size})}">&laquo; Trang trước</a>
                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/products(page=${i}, keyword=${keyword}, size=${size})}"
                       th:text="${i + 1}"
                       th:classappend="${i == currentPage} ? 'active' : ''"></a>
                </span>
                <a th:if="${products.hasNext()}" th:href="@{/products(page=${currentPage + 1}, keyword=${keyword}, size=${size})}">Trang sau &raquo;</a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
