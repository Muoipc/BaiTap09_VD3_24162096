<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác nhận OTP')}"></head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
            <h1>Xác nhận OTP</h1>

            <div th:if="${success}" class="alert success" th:text="${success}"></div>
            <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

            <label>Email</label>
            <input type="email" th:field="*{email}" required readonly>

            <label>OTP 6 số</label>
            <input th:field="*{otp}" maxlength="6" inputmode="numeric" required>

            <div class="mt">
                <button class="button full">Xác nhận</button>
            </div>
        </form>

        <form th:action="@{/resend-register-otp}" method="post" class="mt">
            <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
            <button class="button secondary full">Gửi lại OTP</button>
        </form>

        <p class="mt" style="text-align: center;">
            <a th:href="@{/login}">Quay lại Login</a>
        </p>
    </div>
</div>

</body>
</html>
