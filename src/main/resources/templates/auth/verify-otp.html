<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác nhận OTP - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="brand-title">IOTSTAR SHOP</div>
    <h2>Xác nhận mã OTP</h2>
    <p class="subtitle">Nhập mã OTP 6 chữ số vừa được gửi đến email của bạn</p>

    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <div class="form-group">
            <label for="email">Email tài khoản</label>
            <input type="email" id="email" th:field="*{email}" readonly style="background: #f1f5f9;">
        </div>

        <div class="form-group">
            <label for="otp">Mã OTP (6 chữ số)</label>
            <input type="text" id="otp" th:field="*{otp}" required maxlength="6" autofocus placeholder="123456" style="text-align: center; font-size: 20px; letter-spacing: 4px; font-weight: bold;">
        </div>

        <button class="btn primary full" type="submit">Xác nhận kích hoạt tài khoản</button>
    </form>

    <div style="margin-top: 15px;">
        <form th:action="@{/resend-register-otp}" method="post">
            <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
            <button type="submit" class="btn secondary full">Gửi lại mã OTP mới</button>
        </form>
    </div>

    <div class="auth-footer">
        <a th:href="@{/login}">Quay về Đăng nhập</a>
    </div>
</div>

</body>
</html>
