<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <h1>Đặt lại mật khẩu</h1>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

        <form th:action="@{/reset-password}" th:object="${forgotPasswordDTO}" method="post">
            <label>Email</label>
            <input type="email" th:field="*{email}" readonly style="background: #f1f5f9;">

            <label>Mã OTP (6 chữ số)</label>
            <input type="text" th:field="*{otp}" required maxlength="6" inputmode="numeric">

            <label>Mật khẩu mới</label>
            <input type="password" th:field="*{password}" required>

            <label>Xác nhận mật khẩu mới</label>
            <input type="password" th:field="*{confirmPassword}" required>

            <div class="mt">
                <button class="button full">Cập nhật mật khẩu</button>
            </div>
        </form>

        <p class="mt" style="text-align: center;">
            <a th:href="@{/login}">Quay lại Login</a>
        </p>
    </div>
</div>

</body>
</html>
