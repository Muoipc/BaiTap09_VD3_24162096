<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="brand-title">IOTSTAR SHOP</div>
    <h2>Đặt lại mật khẩu</h2>
    <p class="subtitle">Nhập mã OTP và thiết lập mật khẩu mới cho tài khoản</p>

    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/reset-password}" th:object="${forgotPasswordDTO}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" readonly style="background: #f1f5f9;">
        </div>

        <div class="form-group">
            <label for="otp">Mã OTP (6 chữ số)</label>
            <input type="text" id="otp" th:field="*{otp}" required maxlength="6" autofocus placeholder="123456" style="text-align: center; font-size: 18px; font-weight: bold; letter-spacing: 3px;">
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu mới</label>
            <input type="password" id="password" th:field="*{password}" required placeholder="Tối thiểu 6 ký tự">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Xác nhận mật khẩu mới</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required placeholder="Nhập lại mật khẩu mới">
        </div>

        <button class="btn primary full" type="submit">Cập nhật mật khẩu mới</button>
    </form>

    <div class="auth-footer">
        <a th:href="@{/login}">Quay về Đăng nhập</a>
    </div>
</div>

</body>
</html>
