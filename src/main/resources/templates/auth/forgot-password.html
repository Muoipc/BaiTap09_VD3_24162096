<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="brand-title">IOTSTAR SHOP</div>
    <h2>Quên mật khẩu</h2>
    <p class="subtitle">Nhập email đăng ký để nhận mã OTP đặt lại mật khẩu</p>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label for="email">Địa chỉ Email</label>
            <input type="email" id="email" name="email" required autofocus placeholder="email@gmail.com">
        </div>

        <button class="btn primary full" type="submit">Gửi mã OTP đặt lại mật khẩu</button>
    </form>

    <div class="auth-links">
        <a th:href="@{/login}">Quay lại Đăng nhập</a>
    </div>

    <div class="auth-footer">
        <a th:href="@{/}">Về Trang chủ</a>
    </div>
</div>

</body>
</html>
