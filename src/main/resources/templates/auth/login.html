<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Login')}"></head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <h1>Login</h1>

        <div th:if="${param.error}" class="alert error">
            Tên đăng nhập hoặc mật khẩu không đúng.
        </div>
        <div th:if="${param.verified}" class="alert success">
            Kích hoạt tài khoản thành công.
        </div>
        <div th:if="${param.reset}" class="alert success">
            Đổi mật khẩu thành công.
        </div>
        <div th:if="${param.logout}" class="alert success">
            Bạn đã đăng xuất.
        </div>

        <form th:action="@{/login}" method="post">
            <label>Username</label>
            <input type="text" name="username" required autofocus>

            <label>Password</label>
            <input type="password" name="password" required>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mt">
                <button class="button full">Đăng nhập</button>
            </div>
        </form>

        <p class="mt" style="text-align: center;">
            <a th:href="@{/register}">Đăng ký</a> · <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </p>
    </div>
</div>

</body>
</html>
