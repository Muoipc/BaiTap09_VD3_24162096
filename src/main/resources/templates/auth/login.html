<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="brand-title">IOTSTAR SHOP</div>
    <h2>Đăng nhập</h2>

    <div class="alert error" th:if="${param.error}">
        Tên đăng nhập hoặc mật khẩu không chính xác, hoặc tài khoản chưa kích hoạt.
    </div>

    <div class="alert success" th:if="${param.verified}">
        Kích hoạt tài khoản thành công! Hãy đăng nhập ngay.
    </div>

    <div class="alert success" th:if="${param.reset}">
        Đặt lại mật khẩu thành công! Hãy đăng nhập với mật khẩu mới.
    </div>

    <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Tên đăng nhập / Email</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button class="btn primary full" type="submit">Đăng nhập</button>
    </form>

    <div class="auth-links">
        <a th:href="@{/register}">Đăng ký tài khoản</a> · 
        <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
    </div>

    <div class="auth-footer">
        <a th:href="@{/}">Về trang chủ</a>
    </div>
</div>

</body>
</html>
