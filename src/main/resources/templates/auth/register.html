<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng ký')}"></head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <h1>Đăng ký</h1>

        <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${registerDTO}" method="post">
            <label>Username</label>
            <input th:field="*{username}" required>

            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Họ tên</label>
            <input th:field="*{fullName}" required>

            <label>Password</label>
            <input type="password" th:field="*{password}" required>

            <div class="mt">
                <button class="button full">Đăng ký</button>
            </div>
        </form>

        <p class="mt" style="text-align: center;">
            <a th:href="@{/login}">Quay lại Login</a>
        </p>
    </div>
</div>

</body>
</html>
