<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode == 'create' ? 'Thêm User mới' : 'Chỉnh sửa User'}">Form User</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container narrow">
    <div class="page-title">
        <div>
            <h1 th:text="${mode == 'create' ? 'Thêm Người dùng mới' : 'Chỉnh sửa Người dùng #' + userDTO.id}"></h1>
            <p class="subtitle">Quản trị viên chỉnh sửa thông tin tài khoản và vai trò</p>
        </div>
        <div>
            <a class="btn secondary" th:href="@{/users}">Quay lại</a>
        </div>
    </div>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card">
        <form th:action="${mode == 'create' ? '/users/create' : '/users/edit/' + userDTO.id}" th:object="${userDTO}" method="post">
            <div class="form-group">
                <label for="username">Username (*)</label>
                <input type="text" id="username" th:field="*{username}" th:readonly="${mode == 'edit'}" required>
            </div>

            <div class="form-group">
                <label for="email">Email (*)</label>
                <input type="email" id="email" th:field="*{email}" th:readonly="${mode == 'edit'}" required>
            </div>

            <div class="form-group">
                <label for="fullName">Họ và tên (*)</label>
                <input type="text" id="fullName" th:field="*{fullName}" required>
            </div>

            <div class="form-group">
                <label for="images">URL Hình ảnh đại diện</label>
                <input type="text" id="images" th:field="*{images}" placeholder="https://...">
            </div>

            <div class="form-group">
                <label for="password" th:text="${mode == 'create' ? 'Mật khẩu (*)' : 'Mật khẩu mới (bỏ trống nếu không đổi)'}"></label>
                <input type="password" id="password" th:field="*{password}" th:required="${mode == 'create'}">
            </div>

            <div class="form-group">
                <label for="roleName">Vai trò (Role)</label>
                <select id="roleName" th:field="*{roleName}">
                    <option value="ROLE_USER">ROLE_USER (Người dùng thông thường)</option>
                    <option value="ROLE_ADMIN">ROLE_ADMIN (Quản trị viên)</option>
                </select>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="enabled" th:field="*{enabled}" style="width: auto;">
                <label for="enabled" style="margin-bottom: 0;">Kích hoạt tài khoản (Đã xác thực OTP)</label>
            </div>

            <button type="submit" class="btn primary full" th:text="${mode == 'create' ? 'Tạo mới User' : 'Lưu cập nhật'}"></button>
        </form>
    </div>
</main>

</body>
</html>
