<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm User' : 'Sửa User'})}"></head>
<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <h1 th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}"></h1>

    <div class="panel">
        <form th:object="${userDTO}" method="post"
              th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">

            <div style="margin-bottom: 14px;">
                <label style="display:block; font-weight:600; margin-bottom:4px;">Username</label>
                <input th:field="*{username}" th:readonly="${mode == 'edit'}" style="width:100%;">
                <small class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
            </div>

            <div style="margin-bottom: 14px;">
                <label style="display:block; font-weight:600; margin-bottom:4px;">Email</label>
                <input type="email" th:field="*{email}" th:readonly="${mode == 'edit'}" style="width:100%;">
                <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
            </div>

            <div style="margin-bottom: 14px;">
                <label style="display:block; font-weight:600; margin-bottom:4px;">Họ tên</label>
                <input th:field="*{fullName}" style="width:100%;">
                <small class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
            </div>

            <div style="margin-bottom: 14px;">
                <label style="display:block; font-weight:600; margin-bottom:4px;">Role</label>
                <select th:field="*{roleName}" style="width:100%;">
                    <option value="ROLE_USER">USER</option>
                    <option value="ROLE_ADMIN">ADMIN</option>
                </select>
            </div>

            <div style="margin-bottom: 14px;">
                <label><input type="checkbox" th:field="*{enabled}"> Enabled</label>
            </div>

            <div>
                <button class="button">Lưu</button>
                <a class="button secondary" th:href="@{/users}">Hủy</a>
            </div>
        </form>
    </div>
</main>
</div>

</body>
</html>
